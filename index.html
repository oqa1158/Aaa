<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أذكار الصباح والمساء</title>
<style>
  :root{
    --bg: #1e1233;
    --bg-soft: #2a1a49;
    --card: #ffffff;
    --purple: #5b2a86;
    --purple-dark: #3d1c60;
    --gold: #c9a24b;
    --text: #241536;
    --text-soft: #6b5c85;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 340px, #f3eefc 340px);
    min-height:100vh;
    color:var(--text);
  }
  header{
    text-align:center;
    padding: 34px 16px 26px;
    color:#f3eefc;
  }
  header .logo{
    width: 108px;
    height: 108px;
    border-radius: 18px;
    object-fit: contain;
    background: #f4f1ea;
    box-shadow: 0 6px 18px rgba(0,0,0,.35);
    margin-bottom: 12px;
    padding: 4px;
  }
  header .stars{ font-size:1.4rem; letter-spacing:14px; color:var(--gold); margin-bottom:10px;}
  header h1{ margin:4px 0 2px; font-size:1.5rem; font-weight:600; letter-spacing:1px;}
  header h2{ margin:0; font-size:2.1rem; font-weight:800;}
  header p{ margin:10px auto 0; max-width:420px; font-size:1.15rem; color:#d9caf5; line-height:1.6;}

  .reset-bar{
    max-width:720px;
    margin: 0 auto 18px;
    padding: 0 16px;
    display:flex;
    justify-content:center;
  }
  .reset-btn{
    background: var(--gold);
    color:#3d2a00;
    border:none;
    padding: 12px 26px;
    border-radius: 999px;
    font-size: 1.05rem;
    font-weight:700;
    cursor:pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
  }
  .reset-btn:active{ transform: translateY(1px); }

  main{ max-width:720px; margin:0 auto; padding: 0 16px 60px; }

  .section-title{
    text-align:center;
    font-size:1.6rem;
    font-weight:800;
    color:var(--purple-dark);
    margin: 30px 0 20px;
  }

  .card{
    background:var(--card);
    border-radius:20px;
    padding: 26px 22px;
    margin-bottom: 22px;
    box-shadow: 0 6px 22px rgba(61,28,96,.10);
    border: 1px solid #ece3fa;
  }
  .card .badge{
    display:inline-block;
    background: #f1e6ff;
    color: var(--purple);
    font-weight:700;
    font-size: 1.3rem;
    padding: 6px 16px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  .card .note{
    font-size:1.2rem;
    color: var(--text-soft);
    margin-bottom: 10px;
  }
  .card .zikr-text{
    font-size: 2.05rem;
    line-height: 2.5;
    text-align:right;
    color: var(--text);
    margin-bottom: 22px;
  }

  .counter-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 22px;
  }
  .count-display{
    min-width: 90px;
    text-align:center;
    font-size: 2.4rem;
    font-weight:800;
    color: var(--purple-dark);
    background: #f6f1ff;
    border-radius: 18px;
    padding: 6px 14px;
    border: 2px solid #e3d4fb;
  }
  .tap-btn{
    width: 78px;
    height: 78px;
    border-radius: 50%;
    border:none;
    background: linear-gradient(160deg, var(--purple) 0%, var(--purple-dark) 100%);
    color:#fff;
    font-size: 2.2rem;
    font-weight:800;
    cursor:pointer;
    box-shadow: 0 6px 16px rgba(91,42,134,.4);
    transition: transform .08s ease;
  }
  .tap-btn:active{ transform: scale(0.92); }

  .undo-btn{
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 2px solid #e3d4fb;
    background:#fff;
    color: var(--purple);
    font-size: 1.4rem;
    cursor:pointer;
  }

  .done .zikr-text{ opacity:.45; }
  .done .count-display{ background:#e9fbef; border-color:#bdeccb; color:#1f8a4c; }

  footer{
    text-align:center;
    padding: 24px;
    color: var(--text-soft);
    font-size:1.1rem;
    font-weight:600;
  }

  @media (max-width:420px){
    header h2{ font-size:1.7rem; }
    .card .zikr-text{ font-size:1.75rem; }
    .tap-btn{ width:70px; height:70px; font-size:2rem; }
    .count-display{ font-size:2rem; min-width:76px; }
  }
</style>
</head>
<body>

<header>
  <div class="stars">☾ ✦ ☀</div>
  <h2>أذكار الصباح والمساء</h2>
  <p>حِصنُ المسلم اليومي — مُحافَظةٌ على وِردنا صباحًا ومساءً</p>
</header>

<div class="reset-bar">
  <button class="reset-btn" onclick="resetAll()">↺ إعادة تعيين كل العدّادات</button>
</div>

<main>
  <div class="section-title">أذكار عامة</div>
  <div id="azkar-list"></div>
</main>

<footer>لا تنسونا من صالح دعائكم</footer>

<script>
const azkar = [
  {
    note: "إذا أصبح وإذا أمسى — لها فضل عظيم في الحفظ من كل سوء",
    text: "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ، لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ، لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ، مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ، يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ، وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ، وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ، وَلَا يَئُودُهُ حِفْظُهُمَا، وَهُوَ الْعَلِيُّ الْعَظِيمُ.",
    target: 1,
    badge: "آية الكرسي"
  },
  {
    note: "ثلاث مرات إذا أصبح وإذا أمسى",
    text: "قُلْ هُوَ اللَّهُ أَحَدٌ، اللَّهُ الصَّمَدُ، لَمْ يَلِدْ وَلَمْ يُولَدْ، وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ.",
    target: 3,
    badge: "سورة الإخلاص"
  },
  {
    note: "ثلاث مرات إذا أصبح وإذا أمسى",
    text: "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ، مِنْ شَرِّ مَا خَلَقَ، وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ، وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ، وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ.",
    target: 3,
    badge: "سورة الفلق"
  },
  {
    note: "ثلاث مرات إذا أصبح وإذا أمسى",
    text: "قُلْ أَعُوذُ بِرَبِّ النَّاسِ، مَلِكِ النَّاسِ، إِلَهِ النَّاسِ، مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ، الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ، مِنَ الْجِنَّةِ وَالنَّاسِ.",
    target: 3,
    badge: "سورة الناس"
  },
  {
    note: "إذا أصبح: «أصبحنا وأصبح» — إذا أمسى: «أمسينا وأمسى»",
    text: "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لله، وَالْحَمْدُ لله، لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ،\nرَبِّ أَسْأَلُكَ خَيْرَ مَا فِي هَذَا الْيَوْمِ وَخَيْرَ مَا بَعْدَهُ، وَأَعُوذُ بِكَ مِنْ شَرِّ مَا فِي هَذِهِ اللَّيْلَةِ وَشَرِّ مَا بَعْدَهَا،\nرَبِّ أَعُوذُ بِكَ مِنَ الْكَسَلِ وَسُوءِ الْكِبَرِ، رَبِّ أَعُوذُ بِكَ مِنْ عَذَابٍ فِي النَّارِ وَعَذَابٍ فِي الْقَبْرِ.",
    target: 1
  },
  {
    note: "إذا أصبح: «بك أصبحنا وبك أمسينا وبك نحيا وبك نموت» — إذا أمسى: «بك أمسينا وبك أصبحنا وبك نحيا وبك نموت»",
    text: "اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ.",
    target: 1
  },
  {
    note: "إذا أصبح",
    text: "أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ، وَعَلَى كَلِمَةِ الْإِخْلَاصِ، وَعَلَى دِينِ نَبِيِّنَا مُحَمَّدٍ ﷺ، وَعَلَى مِلَّةِ أَبِينَا إِبْرَاهِيمَ، حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ.",
    target: 1
  },
  {
    note: "سبع مرات إذا أصبح وإذا أمسى",
    text: "حَسْبِيَ اللهُ لَا إِلَهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ.",
    target: 7
  },
  {
    note: "",
    text: "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ.",
    target: 1,
    badge: "سيد الاستغفار"
  },
  {
    note: "أربع مرات",
    text: "اللَّهُمَّ إِنِّي أَصْبَحْتُ أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ، وَمَلَائِكَتَكَ، وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللهُ لَا إِلَهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ.",
    target: 4
  },
  {
    note: "إذا أمسى: «ما أمسى بي»",
    text: "اللَّهُمَّ مَا أَصْبَحَ بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ.",
    target: 1
  },
  {
    note: "ثلاث مرات",
    text: "اللَّهُمَّ عَافِنِي فِي بَدَنِي، اللَّهُمَّ عَافِنِي فِي سَمْعِي، اللَّهُمَّ عَافِنِي فِي بَصَرِي، لَا إِلَهَ إِلَّا أَنْتَ. اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْكُفْرِ وَالْفَقْرِ، وَاللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ عَذَابِ الْقَبْرِ، لَا إِلَهَ إِلَّا أَنْتَ.",
    target: 3
  },
  {
    note: "ثلاث مرات",
    text: "رَضِيتُ بِاللهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا.",
    target: 3
  },
  {
    note: "ثلاث مرات",
    text: "بِسْمِ اللهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ.",
    target: 3
  },
  {
    note: "",
    text: "يَا حَيُّ يَا قَيُّومُ بِرَحْمَتِكَ أَسْتَغِيثُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَى نَفْسِي طَرْفَةَ عَيْنٍ.",
    target: 1
  },
  {
    note: "ثلاث مرات — إذا أمسى",
    text: "أَعُوذُ بِكَلِمَاتِ اللهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ.",
    target: 3
  },
  {
    note: "إذا أصبح",
    text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا، وَرِزْقًا طَيِّبًا، وَعَمَلًا مُتَقَبَّلًا.",
    target: 1
  },
  {
    note: "مائة مرة إذا أصبح",
    text: "لَا إِلَهَ إِلَّا اللهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ.",
    target: 100
  },
  {
    note: "مائة مرة في اليوم",
    text: "أَسْتَغْفِرُ اللهَ وَأَتُوبُ إِلَيْهِ.",
    target: 100
  },
  {
    note: "ثلاث مرات إذا أصبح",
    text: "سُبْحَانَ اللهِ وَبِحَمْدِهِ، عَدَدَ خَلْقِهِ، وَرِضَا نَفْسِهِ، وَزِنَةَ عَرْشِهِ، وَمِدَادَ كَلِمَاتِهِ.",
    target: 3
  },
  {
    note: "عشر مرات",
    text: "اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ.",
    target: 10,
    badge: "الصلاة على النبي ﷺ"
  }
];

let counts = new Array(azkar.length).fill(0);

function render(){
  const list = document.getElementById('azkar-list');
  list.innerHTML = '';
  azkar.forEach((z, i) => {
    const isDone = counts[i] >= z.target;
    const card = document.createElement('div');
    card.className = 'card' + (isDone ? ' done' : '');
    card.innerHTML = `
      ${z.badge ? `<div class="badge">${z.badge}</div><br>` : ''}
      ${z.note ? `<div class="note">${z.note}</div>` : ''}
      <div class="zikr-text">${z.text.replace(/\n/g,'<br>')}</div>
      <div class="counter-row">
        <button class="undo-btn" onclick="undo(${i})">↩</button>
        <div class="count-display">${counts[i]} / ${z.target}</div>
        <button class="tap-btn" onclick="tap(${i})">+</button>
      </div>
    `;
    list.appendChild(card);
  });
}

function tap(i){
  counts[i]++;
  render();
}
function undo(i){
  if(counts[i] > 0) counts[i]--;
  render();
}
function resetAll(){
  counts = new Array(azkar.length).fill(0);
  render();
}

render();
</script>
</body>
</html>

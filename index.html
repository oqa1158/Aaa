<style>

    --deep:#0f3d34;
    --deep-2:#145c4d;

    --gold-light:#e4c26a;

  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{

    font-family:'Tajawal',sans-serif;

  }
  .topbar h1{

  }
  .topbar p.sub{
    margin:0;
    color:#cfe3dc;

    max-width:980px;
    margin:-70px auto 0;
    background:var(--paper);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:30px;

    content:"";

    border:1px solid rgba(184,137,43,.35);
    border-radius:12px;
    pointer-events:none;

  h2.section-title{

    font-size:20px;

    margin:0 0 18px;

  h2.section-title .num{

    border-radius:50%;
    background:var(--deep);

    font-family:'Tajawal',sans-serif;

    display:flex;align-items:center;justify-content:center;

    grid-template-columns:1fr 1fr;
    gap:18px 22px;

  .actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px;}
  button.primary{
    font-family:'Tajawal',sans-serif;
    background:var(--deep);
    color:#fbf6e8;
    border:none;
    padding:14px 30px;
    border-radius:10px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(15,61,52,.25);
    transition:transform .1s, background .15s;

  button.primary:hover{background:var(--deep-2);}

  button.secondary{

  /* Print */

    table.plan-table th{background:#0f3d34 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}

    @page{ size:A4; margin:14mm 12mm; }

<script>
(function(){
  const PASSWORD = "الديني23";
  const SESSION_KEY = 'khutta_unlocked';
  const overlay = document.getElementById('lockOverlay');
  const input = document.getElementById('lockPassword');
  const btn = document.getElementById('lockSubmit');
  const err = document.getElementById('lockErr');

  function unlock(){
    document.body.classList.remove('locked');
    sessionStorage.setItem(SESSION_KEY, '1');
  }

  if(sessionStorage.getItem(SESSION_KEY) === '1'){
    unlock();
  }

  function tryUnlock(){
    if(input.value === PASSWORD){
      err.textContent = '';
      unlock();
    } else {
      err.textContent = 'كلمة المرور غير صحيحة، حاول مرة أخرى.';
      input.value = '';
      input.focus();
    }
  }

  btn.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter') tryUnlock();
  });
  if(!overlay.classList.contains('locked')) input.focus();
})();
</script>

<script>
const JUZ_COUNT = 30;
const juzSelect = document.getElementById('juzSelect');
for(let i=1;i<=JUZ_COUNT;i++){
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = 'الجزء ' + arabicOrdinalNumber(i);
  juzSelect.appendChild(opt);
}
function arabicOrdinalNumber(n){ return n.toLocaleString('ar-EG'); }

// default start date = today
document.getElementById('startDate').valueAsDate = new Date();

const WEEKDAY_AR = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

// Standard number of ayahs per surah (index 0 = Surah 1 Al-Fatihah ... index 113 = Surah 114 An-Nas)
// Used only to detect when a memorization unit ends exactly at the last ayah of a surah.
const SURAH_AYAH_COUNT = [
  7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,
  112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,
  54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,
  14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,
  29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,
  11,8,3,9,5,4,7,3,6,3,5,4,5,6
];

// نطاق السور القصيرة في نهاية الجزء الثلاثين (من سورة الضحى رقم 93 إلى سورة الناس رقم 114).
// في هذا النطاق فقط: نصف الصفحة = صفحتان فعليتان، والصفحة الكاملة = 4 صفحات فعلية،
// وذلك لأن صفحات هذه السور قصيرة جدًا فلا يصح تطبيق نفس مقياس بقية الجزء.
const SHORT_SURAHS_JUZ = 30;
const SHORT_SURAHS_FROM = 93;  // سورة الضحى
const SHORT_SURAHS_TO = 114;   // سورة الناس

function pagesCountLabel(n){
  if(n <= 1) return 'صفحة واحدة';
  if(n === 2) return 'صفحتان';
  return n.toLocaleString('ar-EG') + ' صفحات';
}

// يبني وحدات الحفظ لمنطقة السور القصيرة بتجميع صفحات متتالية حتى الوصول إلى targetPages.
function buildSpecialUnits(ayahsList, targetPages){
  const pageGroups = groupByPage(ayahsList);
  const merged = [];
  let i = 0;
  while(i < pageGroups.length){
    let combinedAyahs = [];
    const pagesInChunk = [];
    while(i < pageGroups.length && pagesInChunk.length < targetPages){
      const g = pageGroups[i];
      combinedAyahs = combinedAyahs.concat(g.ayahs);
      if(!pagesInChunk.includes(g.page)) pagesInChunk.push(g.page);
      i++;
    }
    merged.push({ ayahs: combinedAyahs, half:null, pages: pagesInChunk, pagesLabelOverride: pagesCountLabel(pagesInChunk.length) });
  }
  return merged;
}

async function fetchJuzAyahs(juzNumber){
  // Uses the public AlQuran.cloud API (Uthmani script edition) to fetch all ayahs of a given juz,
  // including surah name and mushaf page number for each ayah.
  const url = `https://api.alquran.cloud/v1/juz/${juzNumber}/quran-uthmani`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('تعذّر الاتصال بواجهة القرآن الكريم');
  const data = await res.json();
  if(data.code !== 200) throw new Error('تعذّر جلب بيانات الجزء');
  return data.data.ayahs.map(a => ({
    surahName: a.surah.name,
    surahNumber: a.surah.number,
    ayahNumberInSurah: a.numberInSurah,
    page: a.page
  }));
}

// يجلب آيات الجزء المطلوب، ثم يتأكد أن أول سورة وآخر سورة فيه مكتملتان بالكامل:
// إن كانت أول سورة في الجزء قد بدأ حفظها فعليًا من جزء سابق (أي لا تبدأ من آيتها الأولى)،
// أو كانت آخر سورة تمتد إلى جزء لاحق (أي لا تنتهي بآيتها الأخيرة)، يجلب الجزء/الأجزاء
// المجاورة ويكمّل بها آيات تلك السورة، بحيث تظهر كل سورة كاملة ضمن هذا الجزء ولا تُقطع.
// ملاحظة: قد يتكرر هذا عبر أكثر من جزء مجاور للسور الطويلة الممتدة عبر عدة أجزاء.
async function fetchJuzAyahsComplete(juzNumber){
  const juzCache = {}; // تفادي إعادة جلب نفس الجزء أكثر من مرة
  const getJuz = async (n) => {
    if(!juzCache[n]) juzCache[n] = await fetchJuzAyahs(n);
    return juzCache[n];
  };

  let ayahs = await getJuz(juzNumber);

  // إكمال أول سورة إن كانت بدأت في جزء سابق
  let back = 0;
  while(ayahs.length && ayahs[0].ayahNumberInSurah > 1 && juzNumber - back - 1 >= 1){
    back++;
    const prevAyahs = await getJuz(juzNumber - back);
    const firstSurahNumber = ayahs[0].surahNumber;
    const missing = prevAyahs.filter(a => a.surahNumber === firstSurahNumber && a.ayahNumberInSurah < ayahs[0].ayahNumberInSurah);
    if(missing.length === 0) break; // لم تعد السورة موجودة في هذا الجزء السابق
    ayahs = missing.concat(ayahs);
  }

  // إكمال آخر سورة إن كانت تمتد إلى جزء لاحق
  let fwd = 0;
  while(ayahs.length){
    const last = ayahs[ayahs.length-1];
    const total = SURAH_AYAH_COUNT[last.surahNumber-1];
    if(last.ayahNumberInSurah >= total) break;
    fwd++;
    if(juzNumber + fwd > 30) break;
    const nextAyahs = await getJuz(juzNumber + fwd);
    const missing = nextAyahs.filter(a => a.surahNumber === last.surahNumber && a.ayahNumberInSurah > last.ayahNumberInSurah);
    if(missing.length === 0) break;
    ayahs = ayahs.concat(missing);
  }

  return ayahs;
}

// Group consecutive ayahs belonging to the same surah into surah-segments (in reading order).
function groupBySurah(ayahs){
  const groups = [];
  let current = null;
  for(const a of ayahs){
    if(!current || current.surahNumber !== a.surahNumber){
      current = { surahNumber:a.surahNumber, surahName:a.surahName, ayahs:[] };
      groups.push(current);
    }
    current.ayahs.push(a);
  }
  return groups;
}

// Group consecutive ayahs sharing the same mushaf page into page-groups (in reading order).
function groupByPage(ayahs){
  const groups = [];
  let current = null;
  for(const a of ayahs){
    if(!current || current.page !== a.page){
      current = { page:a.page, ayahs:[] };
      groups.push(current);
    }
    current.ayahs.push(a);
  }
  return groups;
}

function uniquePages(ayahsList){
  const pages = [];
  ayahsList.forEach(a => { if(!pages.includes(a.page)) pages.push(a.page); });
  return pages;
}

// Split an ayah list into two halves without breaking a single ayah in two.
function splitHalves(ayahsList){
  if(ayahsList.length <= 1){
    return [ { ayahs:ayahsList, half:'كاملة', pages:uniquePages(ayahsList) } ];
  }
  const mid = Math.ceil(ayahsList.length/2);
  const firstHalf = ayahsList.slice(0,mid);
  const secondHalf = ayahsList.slice(mid);
  return [
    { ayahs:firstHalf, half:'النصف الأول', pages:uniquePages(firstHalf) },
    { ayahs:secondHalf, half:'النصف الثاني', pages:uniquePages(secondHalf) }
  ];
}

function marksEndOfSurah(ayahsList){
  const last = ayahsList[ayahsList.length-1];
  const total = SURAH_AYAH_COUNT[last.surahNumber-1];
  return last.ayahNumberInSurah === total;
}

function buildUnits(surahAyahs, amount, pageFullCount){
  const pageGroups = groupByPage(surahAyahs); // page-groups restricted to this surah only, in order

  // A page-group that doesn't cover a full physical page means the surah starts or ends mid-page
  // (sharing that page with the previous/next surah). Rather than leaving that small fragment as
  // its own tiny unit, merge it with the neighboring page-group within the same surah so the
  // resulting chunk is close to a real page. This applies whether the daily amount is a full page
  // or a half page (e.g. Surah Al-Hadid in Juz 27, where it previously left a very small "page").
  const merged = [];
  for(let i=0;i<pageGroups.length;i++){
    const g = pageGroups[i];
    const fullCount = pageFullCount[g.page] || g.ayahs.length;
    const isPartial = g.ayahs.length < fullCount;

    if(isPartial && merged.length === 0 && i+1 < pageGroups.length){
      // Fragment at the very start of the surah: pull in ayahs from the following page.
      const next = pageGroups[i+1];
      merged.push({ ayahs: g.ayahs.concat(next.ayahs), pages:[g.page, next.page] });
      i++; // next page-group already consumed
    } else if(isPartial && merged.length > 0){
      // Fragment at the end of the surah: attach it to the previous chunk instead of leaving it alone.
      const prev = merged[merged.length-1];
      prev.ayahs = prev.ayahs.concat(g.ayahs);
      if(!prev.pages.includes(g.page)) prev.pages.push(g.page);
    } else {
      merged.push({ ayahs: g.ayahs.slice(), pages:[g.page] });
    }
  }

  if(amount === 'full'){
    // Each merged chunk becomes one day's unit. When a chunk had to pull in a neighboring page
    // (so it spans more than one physical mushaf page), label it with the actual page count
    // instead of the generic "صفحة كاملة" so the plan stays accurate.
    return merged.map(mg => ({
      ayahs: mg.ayahs,
      half: null,
      pages: mg.pages,
      pagesLabelOverride: mg.pages.length > 1 ? pagesCountLabel(mg.pages.length) : null
    }));
  }

  // amount === 'half': split each merged chunk into two halves.
  const units = [];
  merged.forEach(mg => { splitHalves(mg.ayahs).forEach(u => units.push(u)); });
  return units;
}

function surahRangeLabel(ayahsList){
  const first = ayahsList[0];
  const last = ayahsList[ayahsList.length-1];
  if(first.surahNumber === last.surahNumber){
    if(first.ayahNumberInSurah === last.ayahNumberInSurah){
      return { surah:first.surahName, range: 'آية ' + first.ayahNumberInSurah.toLocaleString('ar-EG') };
    }
    return { surah:first.surahName, range: 'من آية ' + first.ayahNumberInSurah.toLocaleString('ar-EG') + ' إلى ' + last.ayahNumberInSurah.toLocaleString('ar-EG') };
  }
  return { surah: first.surahName + ' ← ' + last.surahName,
           range: 'من آية ' + first.ayahNumberInSurah.toLocaleString('ar-EG') + ' إلى آية ' + last.ayahNumberInSurah.toLocaleString('ar-EG') };
}

function pageLabel(pagesArr){
  if(pagesArr.length === 1) return pagesArr[0].toLocaleString('ar-EG');
  return pagesArr[0].toLocaleString('ar-EG') + '-' + pagesArr[pagesArr.length-1].toLocaleString('ar-EG');
}

function nextValidDate(d, mode){
  const nd = new Date(d);
  nd.setDate(nd.getDate()+1);
  if(mode === 'sun-thu'){
    while(nd.getDay() === 5 || nd.getDay() === 6){ // Friday=5, Saturday=6
      nd.setDate(nd.getDate()+1);
    }
  }
  return nd;
}

function formatDateAr(d){
  return d.toLocaleDateString('ar-EG-u-nu-latn', { year:'numeric', month:'2-digit', day:'2-digit' });
}

async function generatePlan(){
  const name = document.getElementById('studentName').value.trim();
  const juz = parseInt(juzSelect.value,10);
  const amount = document.querySelector('input[name=amount]:checked').value;
  const daysMode = document.querySelector('input[name=days]:checked').value;
  const startDateVal = document.getElementById('startDate').value;
  const statusEl = document.getElementById('statusMsg');
  const btn = document.getElementById('generateBtn');

  if(!name){ statusEl.textContent='الرجاء إدخال اسم الطالب.'; statusEl.className='status err'; return; }
  if(!startDateVal){ statusEl.textContent='الرجاء تحديد تاريخ البداية.'; statusEl.className='status err'; return; }

  statusEl.className='status';
  statusEl.textContent='جارٍ جلب بيانات الجزء من واجهة القرآن الكريم...';
  btn.disabled = true;

  try{
    const ayahs = await fetchJuzAyahsComplete(juz);

    // عدد الآيات الكامل لكل صفحة فعلية في الجزء (بغض النظر عن السورة) - يُستخدم لاكتشاف الأجزاء
    // الصغيرة من الصفحة عند بداية أو نهاية سورة، حتى لا يخرج "نصف الصفحة" قليلًا جدًا.
    const pageFullCount = {};
    groupByPage(ayahs).forEach(pg => { pageFullCount[pg.page] = pg.ayahs.length; });

    // نبدأ من آخر سورة في الجزء ونتراجع نحو أول سورة فيه، على أن يبدأ حفظ كل سورة من أول آية فيها.
    const surahGroups = groupBySurah(ayahs).reverse();
    let units = [];

    if(juz === SHORT_SURAHS_JUZ){
      // نجمع آيات نطاق السور القصيرة معًا (قد تمتد عبر عدة سور متتالية) ونبني وحدات صفحات لها،
      // وما تبقى من الجزء يُعامل بالطريقة المعتادة (صفحة/نصف صفحة).
      const targetPages = amount === 'full' ? 4 : 2;
      let specialBatch = [];
      const flushSpecial = () => {
        if(specialBatch.length){
          units.push(...buildSpecialUnits(specialBatch, targetPages));
          specialBatch = [];
        }
      };
      surahGroups.forEach(sg => {
        if(sg.surahNumber >= SHORT_SURAHS_FROM && sg.surahNumber <= SHORT_SURAHS_TO){
          specialBatch.push(...sg.ayahs);
        } else {
          flushSpecial();
          units.push(...buildUnits(sg.ayahs, amount, pageFullCount));
        }
      });
      flushSpecial();
    } else {
      surahGroups.forEach(sg => {
        units.push(...buildUnits(sg.ayahs, amount, pageFullCount));
      });
    }

    units.forEach(u => { u.endsSurah = marksEndOfSurah(u.ayahs); });

    // schedule dates
    let currentDate = new Date(startDateVal + 'T00:00:00');
    // If chosen mode excludes Fri/Sat, make sure the very first day itself is valid; if not, push forward.
    if(daysMode === 'sun-thu'){
      while(currentDate.getDay() === 5 || currentDate.getDay() === 6){
        currentDate = nextValidDate(currentDate, daysMode);
      }
    }

    const rows = units.map((u, idx) => {
      const dateForRow = new Date(currentDate);
      const label = surahRangeLabel(u.ayahs);
      const row = {
        dayIndex: idx+1,
        date: dateForRow,
        pageLabel: pageLabel(u.pages),
        surah: label.surah,
        range: label.range,
        amountLabel: u.pagesLabelOverride ? u.pagesLabelOverride : (amount === 'full' ? 'صفحة كاملة' : (u.half === 'كاملة' ? 'صفحة كاملة' : u.half)),
        endsSurah: u.endsSurah,
        lastAyahNumber: u.ayahs[u.ayahs.length-1].ayahNumberInSurah
      };
      currentDate = nextValidDate(currentDate, daysMode);
      return row;
    });

    renderPlan({ name, juz, amount, daysMode, rows });
    statusEl.textContent = 'تم إنشاء الخطة بنجاح — عدد الأيام: ' + rows.length.toLocaleString('ar-EG');
    document.getElementById('printBtn').style.display = 'inline-block';
  }catch(err){
    console.error(err);
    statusEl.className='status err';
    statusEl.innerHTML = 'تعذّر الاتصال بواجهة بيانات القرآن الكريم.<br>' +
      'إن كنت تشاهد هذه الصفحة داخل معاينة تطبيق Claude فهذا متوقع، لأن المعاينة تمنع الاتصال بمواقع خارجية لأسباب أمنية.<br>' +
      '<b>الحل:</b> حمّل الملف إلى جهازك ثم افتحه مباشرة من متصفح Chrome أو Edge (خارج تطبيق Claude)، وتأكد من اتصالك بالإنترنت.';
  }finally{
    btn.disabled = false;
  }
}

function renderPlan({name, juz, amount, daysMode, rows}){
  const wrap = document.getElementById('plan-wrap');
  const today = new Date();

  const daysModeLabel = daysMode === 'daily' ? 'يوميًا' : 'من الأحد إلى الخميس';
  const amountModeLabel = amount === 'full' ? 'صفحة يوميًا' : 'نصف صفحة يوميًا';

  const rowsHtml = rows.map(r => {
    const isWeekend = (r.date.getDay() === 5 || r.date.getDay() === 6);
    return `
    <tr class="${daysMode==='daily' && isWeekend ? 'weekend-row' : ''}">
      <td>${r.dayIndex.toLocaleString('ar-EG')}</td>
      <td>${WEEKDAY_AR[r.date.getDay()]}</td>
      <td>${formatDateAr(r.date)}</td>
      <td>${r.pageLabel}</td>
      <td class="surah-cell">${r.surah}${r.endsSurah ? '<br><span class="end-badge">نهاية السورة (آية ' + r.lastAyahNumber.toLocaleString('ar-EG') + ')</span>' : ''}</td>
      <td>${r.range}</td>
      <td>${r.amountLabel}</td>
      <td class="checkbox-cell"><input type="checkbox"></td>
      <td class="notes-cell"></td>
    </tr>`;
  }).join('');

  wrap.innerHTML = `
  <div class="plan-sheet">
    <div class="plan-header">
      <div>
        <h3>خطة حفظ القرآن الكريم</h3>
        <div class="meta">
          حلقة نشاط النسيم<br>
          الطالب: <b>${escapeHtml(name)}</b> &nbsp;|&nbsp; الجزء: <b>${juz.toLocaleString('ar-EG')}</b><br>
          نظام الحفظ: <b>${amountModeLabel}</b> &nbsp;|&nbsp; أيام الحفظ: <b>${daysModeLabel}</b><br>
          اتجاه الحفظ: <b>من آخر سورة في الجزء إلى أولها، وحفظ كل سورة يبدأ من آيتها الأولى</b><br>
          ملاحظة: أي سورة تبدأ أو تنتهي داخل هذا الجزء تُحفظ كاملة، حتى لو كان جزء منها يقع أصلًا ضمن جزء مجاور.
          ${juz === 30 ? '<br>ملاحظة: في السور القصيرة (من الضحى إلى الناس) يُحتسب المقدار اليومي بعدد الصفحات (صفحتان بدل نصف صفحة، أو 4 صفحات بدل صفحة كاملة).' : ''}
        </div>
      </div>
      <div class="badge">تاريخ الإصدار: ${formatDateAr(today)}</div>
    </div>

    <table class="plan-table">
      <thead>
        <tr>
          <th>اليوم</th>
          <th>يوم الأسبوع</th>
          <th>التاريخ</th>
          <th>صفحة المصحف</th>
          <th>السورة</th>
          <th>الآيات</th>
          <th>المقدار</th>
          <th>إنجاز</th>
          <th>ملاحظات المعلم</th>
        </tr>
      </thead>
      <tbody>
        ${rowsHtml}
      </tbody>
    </table>

    <div class="signatures">
      <div class="sig-box">توقيع الطالب</div>
      <div class="sig-box">توقيع المعلم</div>
      <div class="sig-box">توقيع ولي الأمر</div>
    </div>
    <div class="footnote">تم إنشاء هذه الخطة تلقائيًا — حلقة نشاط النسيم لتحفيظ القرآن الكريم</div>
  </div>`;

  wrap.scrollIntoView({behavior:'smooth', block:'start'});
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
